<!DOCTYPE html>
<html lang="en">
<head>
    <title>eaux - {{ album | lower }}</title>
    <style>
        :root {
            --primary-color: #eee8d5;
            --secondary-color: #002b36;
            --background-0-color: #002b36;
            --background-1-color: #00323f;
            --background-2-color: #003b4a;
            --background-3-color: #005064;
            --slider-progress: 100%;
        }
    </style>
    <link rel="icon" type="image/ico" href="/static/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/album.css">
    {% if dev_mode %}
    <script type="module" src="http://localhost:5173/@vite/client"></script>
    <script type="module" src="http://localhost:5173/static/js/album.js"></script>
    {% else %}
    <script type="module" src="{{ url_for('static', filename='dist/' + vite_asset('static/js/album.js')) }}"></script>
    {% endif %}
</head>
<body>
<div class="back-button-container">
    <a href="/{{ genre }}" class="back-button">
        <i class="fa-solid fa-chevron-left back-icon"></i>
    </a>
</div>
<div id="album" data-album="{{ album }}"></div>
<div id="genre" data-genre="{{ genre }}"></div>
<audio id="audio" autoplay controls hidden>
    <source
            id="source"
            src=""
            type="audio/x-wav;codec=pcm"
    >
</audio>
<div class="title-container">
    <p id="title">{{ album }} - {{ artist }}</p>
</div>
<div class="list-container">
    <p id="list"></p>
    {% for song in songs %}
    <button type="button" class="song-button" data-song="{{ song }}">
        {{ song }}
    </button>
    {% endfor %}
</div>
<div class="volume-slider-container">
    <label>
        <input
                type="range"
                id="volume-slider"
                class="volume-slider"
                min="0"
                max="100"
                value="100"
        >
    </label>
</div>
</body>
</html>
