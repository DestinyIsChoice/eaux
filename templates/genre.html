<!DOCTYPE html>
<html lang="en">
<head>
    <title>eaux - {{ genre }}</title>
    <style>
        :root {
            --primary-color: #ca9ee6;
            --secondary-color: #232634;
            --background-0-color: #232634;
            --background-1-color: #292c3c;
            --background-2-color: #303446;
            --background-3-color: #414559;
            --background-4-color: #494d64;
            --background-5-color: #51576d;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/genre.css">
    {% if dev_mode %}
        <script type="module" src="http://localhost:5173/@vite/client"></script>
        <script type="module" src="http://localhost:5173/static/js/genre.js"></script>
    {% else %}
        <script type="module" src="{{ url_for('static', filename='dist/' + vite_asset('static/js/genre.js')) }}"></script>
    {% endif %}
</head>
<body>
<div class="back-button-container">
    <a href="/" class="back-button">
        <i class="fa-solid fa-house home-icon"></i>
    </a>
</div>
<div id="genre" data-genre="{{ genre }}"></div>
<audio id="audio" autoplay controls hidden>
    <source
            id="source"
            src=""
            type="audio/x-wav;codec=pcm"
    >
    your browser does not support audio on this website!
</audio>
<div class="list-container">
    <p id="list"></p>
</div>
<div class="song-form-dropdown-container">
    <button type="button" class="song-form-dropdown-trigger">
        submit a song
    </button>
</div>
<form id="song-form" method="POST">
    <label>
        <input
                spellcheck="false"
                name="song-search"
                placeholder="song"
        >
    </label>
    <label>
        <input
                spellcheck="false"
                name="artist-search"
                placeholder="artist"
        >
    </label>
    <button
            type="submit"
            name="song-submit"
            value="clicked"
    >submit
    </button>
</form>
<div class="album-form-dropdown-container">
    <button type="button" class="album-form-dropdown-trigger">
        submit an album
    </button>
</div>
<form id="album-form" method="POST">
    <label>
        <input
                spellcheck="false"
                name="album-search"
                placeholder="album"
        >
    </label>
    <label>
        <input
                spellcheck="false"
                name="artist-search"
                placeholder="artist"
        >
    </label>
    <button
            type="submit"
            name="album-submit"
            value="clicked"
    >submit
    </button>
</form>
</body>
</html>
