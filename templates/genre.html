<!DOCTYPE html>
<html lang="en">
<head>
    <title>eaux - {{ genre }}</title>
    <style>
        :root {
            --primary-color: #ca9ee6;
            --secondary-color: #232634;
            --background-0-color: #232634;
            --background-1-color: #292c3c;
            --background-2-color: #303446;
            --background-3-color: #414559;
            --background-4-color: #494d64;
            --background-5-color: #51576d;
            --scroll-width: 0;
            --slider-progress: 100%;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="stylesheet" href="../static/css/genre.css">
    {% if dev_mode %}
    <script type="module" src="http://localhost:5173/@vite/client"></script>
    <script type="module" src="http://localhost:5173/static/js/genre.js"></script>
    {% else %}
    <script type="module" src="{{ url_for('static', filename='dist/' + vite_asset('static/js/genre.js')) }}"></script>
    {% endif %}
</head>
<body>
<div class="back-button-container">
    <a href="/" class="back-button">
        <i class="fa-solid fa-house home-icon"></i>
    </a>
</div>
<div id="genre" data-genre="{{ genre }}"></div>
<div id="max" data-max="{{ max }}"></div>
<audio id="audio" autoplay controls hidden>
    <source
            id="source"
            src=""
            type="audio/x-wav;codec=pcm"
    >
</audio>
<div class="list-container">
    <p id="list"></p>
</div>
<div class="song-form-dropdown-container">
    <button type="button" class="song-form-dropdown-trigger">
        submit a song
    </button>
</div>
<form id="song-form" method="POST">
    <label>
        <input
                class="song-input"
                name="song-search"
                placeholder="song"
                spellcheck="false"
        >
    </label>
    <label>
        <input
                class="song-input"
                name="artist-search"
                placeholder="artist"
                spellcheck="false"
        >
    </label>
    <button
            class="song-submit"
            type="submit"
            name="song-submit"
            value="clicked"
            disabled
    >
        submit
    </button>
</form>
<div class="volume-slider-container">
    <label>
        <input
                type="range"
                id="volume-slider"
                class="volume-slider"
                min="0"
                max="100"
                value="100"
        >
    </label>
</div>
<div class="carousel-container" id="carousel-container">
    <div class="album-form-dropdown-container">
        <button
                type="button"
                class="album-form-dropdown-trigger"
        >
            <i class="fa-solid fa-plus"></i>
        </button>
    </div>
    <div class="carousel-track" id="carousel-track">
        <div class="carousel-divider" id="carousel-divider"></div>
    </div>
    <form id="album-form" method="POST">
        <label>
            <input
                    class="album-input"
                    name="album-search"
                    placeholder="album"
                    spellcheck="false"
            >
        </label>
        <label>
            <input
                    class="album-input"
                    name="artist-search"
                    placeholder="artist"
                    spellcheck="false"
            >
        </label>
        <button
                class="album-submit"
                type="submit"
                name="album-submit"
                value="clicked"
                disabled
        >
            submit
        </button>
    </form>
</div>
</body>
</html>
